name: GitHub Readme Stats
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
  - cron: 0 */12 * * *  
jobs:
  update-cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Update cards
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure output folder
        run: mkdir -p profile

      - name: Generate stats (dark mode)
        run: |
          curl -fsSL --retry 3 "https://github-stats-extended.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=dark" -o profile/stats-dark.svg

      - name: Generate top languages (dark mode)
        run: |
          curl -fsSL --retry 3 "https://github-stats-extended.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&langs_count=6&theme=dark" -o profile/top-langs-dark.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update README cards"
          git push