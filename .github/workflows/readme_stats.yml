name: GitHub Readme Stats
on:
  workflow_dispatch:
  schedule:
  - cron: 0 */12 * * *  
jobs:
  update-cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Update cards
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure output folder
        run: mkdir -p profile

      - name: Generate stats (dark mode)
        run: |
          curl -s "https://github-stats-extended.vercel.app/api?username=${{ github.actor }}&show_icons=true&theme=dark" > profiles/stats-dark.svg

      - name: Generate top languages (dark mode)
        run: |
          curl -s "https://github-stats-extended.vercel.app/api/top-langs/?username=${{ github.actor }}&langs_count=6" > profiles/top-langs-dark.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push